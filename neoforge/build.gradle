plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            gameDirectory = rootProject.file('runs/26.2/neoforge')
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

java_version=17

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]

# Forge. The same jar supports NeoForge 1.20.1, which uses the Forge identity/API.
# Force compilation when checking the minimum/compatibility inputs:
# ./gradlew :forge:compileJava "-Pforge_version=47.1.0" --rerun-tasks
# ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.5" --rerun-tasks
# ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.106" --rerun-tasks
# Keep the Forge coordinate separate from the vanilla/Fabric Minecraft property.
forge_minecraft_version=1.20.1
forge_version=47.4.26
forge_version_range=[47.1.0,)
# The loader version range uses the major version of FML.
forge_loader_version_range=[47,)

# Fabric targets exact Minecraft 1.20.1, including its remapped release jar.
# ./gradlew :fabric:compileJava "-Pfabric_loader_version=0.14.21" "-Pfabric_api_version=0.83.0+1.20.1" --rerun-tasks
# Use the +1.20.1 API artifact; the +1.20 variant excludes Minecraft 1.20.1.
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.14.21
fabric_api_version=0.92.12+1.20.1
# Fabric ignores build metadata (+1.20.1) in version comparisons.
fabric_api_version_range=>=0.83.0
fabric_minecraft_version_range=1.20.1

mod_id=waterproofconcretepowder
mod_name=Waterproof Concrete Powder
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.waterproofconcretepowder

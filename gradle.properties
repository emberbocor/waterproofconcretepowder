org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: merge classes and resources for Forge 26.3 dev runs.
net.minecraftforge.gradle.merge-source-sets=true

minecraft_version=26.3
minecraft_label=26.3
minecraft_version_range=[26.3]
# Vanilla Minecraft (NeoForm) used to compile common. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
neo_version=26.3.0.83
# Lowest supported NeoForge. Force compilation when checking the minimum:
# ./gradlew :neoforge:compileJava "-Pneo_version=26.3.0.0-beta" --rerun-tasks
neo_version_range=[26.3.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Forge for exact Minecraft 26.3. Verify the minimum with:
# ./gradlew :forge:compileJava "-Pforge_version=66.0.0" --rerun-tasks
# Keep the Forge Minecraft target separate from common/Fabric overrides.
forge_minecraft_version=26.3
forge_version=66.0.12
forge_version_range=[66.0.0,)
forge_loader_version_range=[66,)

# Fabric targets exact Minecraft 26.3 with an ordinary, unobfuscated release jar.
# ./gradlew :fabric:compileJava "-Pfabric_loader_version=0.19.3" "-Pfabric_api_version=0.160.5+26.3" --rerun-tasks
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.19.3
fabric_api_version=0.163.0+26.3
# Fabric ignores build metadata (+26.3) in version comparisons.
fabric_api_version_range=>=0.160.5
fabric_minecraft_version_range=26.3

mod_id=waterproofconcretepowder
mod_name=Waterproof Concrete Powder
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.waterproofconcretepowder

org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: merge classes and resources for Forge 1.21.1 dev runs.
net.minecraftforge.gradle.merge-source-sets=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Vanilla Minecraft (NeoForm) used to compile common. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
neo_version=21.1.265
# Lowest supported NeoForge. Force compilation when checking the minimum:
# ./gradlew :neoforge:compileJava "-Pneo_version=21.1.1" --rerun-tasks
neo_version_range=[21.1.1,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Forge for exact Minecraft 1.21.1. Verify the minimum with:
# ./gradlew :forge:compileJava "-Pforge_version=52.0.0" --rerun-tasks
forge_version=52.1.16
forge_version_range=[52.0.0,)
forge_loader_version_range=[52,)

# Fabric targets exact Minecraft 1.21.1, including its remapped release jar.
# ./gradlew :fabric:compileJava "-Pfabric_loader_version=0.15.11" "-Pfabric_api_version=0.102.0+1.21.1" --rerun-tasks
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.15.11
fabric_api_version=0.116.17+1.21.1
# Fabric ignores build metadata (+1.21.1) in version comparisons.
fabric_api_version_range=>=0.102.0
fabric_minecraft_version_range=1.21.1

mod_id=waterproofconcretepowder
mod_name=Waterproof Concrete Powder
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.waterproofconcretepowder

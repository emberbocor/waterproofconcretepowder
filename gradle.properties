org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: merge classes and resources for Forge 26.1-26.1.2 dev runs.
net.minecraftforge.gradle.merge-source-sets=true

minecraft_version=26.1.2
minecraft_label=26.1-26.1.2
minecraft_version_range=[26.1,26.1.2]
# Vanilla Minecraft (NeoForm) used to compile common. See https://projects.neoforged.net/neoforged/neoform
# ./gradlew :common:compileJava "-Pneo_form_version=26.1-1" --rerun-tasks
# ./gradlew :common:compileJava "-Pneo_form_version=26.1.1-1" --rerun-tasks
neo_form_version=26.1.2-1
neo_version=26.1.2.121
# Lowest supported NeoForge for each Minecraft version. Force compilation when checking the minimum:
# ./gradlew :neoforge:compileJava "-Pneo_version=26.1.0.1-beta" --rerun-tasks
# ./gradlew :neoforge:compileJava "-Pneo_version=26.1.1.0-beta" --rerun-tasks
# ./gradlew :neoforge:compileJava "-Pneo_version=26.1.2.0-beta" --rerun-tasks
neo_version_range=[26.1.0.1-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Forge for Minecraft 26.1-26.1.2. Verify each minimum with:
# ./gradlew :forge:compileJava "-Pforge_minecraft_version=26.1" "-Pforge_version=62.0.0" --rerun-tasks
# ./gradlew :forge:compileJava "-Pforge_minecraft_version=26.1.1" "-Pforge_version=63.0.0" --rerun-tasks
# ./gradlew :forge:compileJava "-Pforge_minecraft_version=26.1.2" "-Pforge_version=64.0.0" --rerun-tasks
# Keep the Forge Minecraft target separate from common/Fabric overrides.
forge_minecraft_version=26.1.2
forge_version=64.1.5
forge_version_range=[62.0.0,)
forge_loader_version_range=[62,)

# Fabric targets Minecraft 26.1-26.1.2 with an ordinary, unobfuscated release jar.
# ./gradlew :fabric:compileJava "-Pminecraft_version=26.1" "-Pfabric_loader_version=0.18.4" "-Pfabric_api_version=0.144.0+26.1" --rerun-tasks
# ./gradlew :fabric:compileJava "-Pminecraft_version=26.1.1" "-Pfabric_loader_version=0.18.4" "-Pfabric_api_version=0.144.0+26.1" --rerun-tasks
# ./gradlew :fabric:compileJava "-Pminecraft_version=26.1.2" "-Pfabric_loader_version=0.18.4" "-Pfabric_api_version=0.144.0+26.1" --rerun-tasks
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.18.4
fabric_api_version=0.155.3+26.1.2
# Fabric ignores build metadata (+26.1) in version comparisons.
fabric_api_version_range=>=0.144.0
fabric_minecraft_version_range=>=26.1 <=26.1.2

mod_id=waterproofconcretepowder
mod_name=Waterproof Concrete Powder
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.waterproofconcretepowder

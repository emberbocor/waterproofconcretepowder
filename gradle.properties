org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: merge classes and resources for Forge 1.21.11 dev runs.
net.minecraftforge.gradle.merge-source-sets=true

parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
# Vanilla Minecraft (NeoForm) used to compile common. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050
neo_version=21.11.45
# Lowest supported NeoForge. Force compilation when checking the minimum:
# ./gradlew :neoforge:compileJava "-Pneo_version=21.11.42" --rerun-tasks
neo_version_range=[21.11.42,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Forge for exact Minecraft 1.21.11. Verify the minimum with:
# ./gradlew :forge:compileJava "-Pforge_version=61.0.1" --rerun-tasks
# Keep the Forge Minecraft target separate from common/Fabric overrides.
forge_minecraft_version=1.21.11
forge_version=61.2.1
forge_version_range=[61.0.1,)
forge_loader_version_range=[61,)

# Fabric targets exact Minecraft 1.21.11, including its remapped release jar.
# ./gradlew :fabric:compileJava "-Pfabric_loader_version=0.17.3" "-Pfabric_api_version=0.139.5+1.21.11" --rerun-tasks
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.17.3
fabric_api_version=0.141.6+1.21.11
# Fabric ignores build metadata (+1.21.11) in version comparisons.
fabric_api_version_range=>=0.139.5
fabric_minecraft_version_range=1.21.11

mod_id=waterproofconcretepowder
mod_name=Waterproof Concrete Powder
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.waterproofconcretepowder

org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: merge classes and resources for Forge 26.2 dev runs.
net.minecraftforge.gradle.merge-source-sets=true

minecraft_version=26.2
minecraft_label=26.2
minecraft_version_range=[26.2]
# Vanilla Minecraft (NeoForm) used to compile common. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2
neo_version=26.2.0.93
# Lowest supported NeoForge. Force compilation when checking the minimum:
# ./gradlew :neoforge:compileJava "-Pneo_version=26.2.0.0-beta" --rerun-tasks
neo_version_range=[26.2.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Forge for exact Minecraft 26.2. Verify the minimum with:
# ./gradlew :forge:compileJava "-Pforge_version=65.0.0" --rerun-tasks
# Keep the Forge Minecraft target separate from common/Fabric overrides.
forge_minecraft_version=26.2
forge_version=65.1.5
forge_version_range=[65.0.0,)
forge_loader_version_range=[65,)

# Fabric targets exact Minecraft 26.2 with an ordinary, unobfuscated release jar.
# ./gradlew :fabric:compileJava "-Pfabric_loader_version=0.18.4" "-Pfabric_api_version=0.152.1+26.2" --rerun-tasks
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.18.4
fabric_api_version=0.161.0+26.2
# Fabric ignores build metadata (+26.2) in version comparisons.
fabric_api_version_range=>=0.152.1
fabric_minecraft_version_range=26.2

mod_id=waterproofconcretepowder
mod_name=Waterproof Concrete Powder
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.waterproofconcretepowder

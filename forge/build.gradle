plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
}

minecraft {
    mappings channel: 'official', version: forge_minecraft_version
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}") {
        runs {
            client {
                workingDir = rootProject.layout.projectDirectory.dir("runs/${forge_minecraft_version}/forge-client")
            }
            server {
                workingDir = rootProject.layout.projectDirectory.dir("runs/${forge_minecraft_version}/forge-server")
                args '--nogui'
            }
        }
    }
}
